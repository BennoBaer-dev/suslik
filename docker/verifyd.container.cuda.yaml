# suslik — shipped default configuration (NVIDIA/CUDA variant). Baked into the image as
# /app/verifyd.yaml; the setup wizard writes your real settings to /data/config/
# config.json, which overlays these defaults. Nothing here sends or writes anywhere.
data_dir: /data
modell: adaface
backend: cuda
trigger: poll
mqtt_publish: false
telegram_modus: aus
sub_label_schreiben: false
frigate_sync: false
anwesenheit_push: false
alert_kategorien: []
